name: Refresh scan and deploy

# The scan table is precomputed rather than fetched in the browser: a live
# client-side scan of every v3 pool needs ~200 API calls and Balancer's
# endpoint (behind Cloudflare) starts returning 429 partway through, silently
# dropping most pools. The source data is daily snapshots, so a nightly
# rebuild is exactly as fresh as the data itself — and visitors just load one
# static JSON.

on:
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC daily, off the hour to avoid the stampede
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Lower concurrency plus empty-response retries pushed the scan past the old
    # 45 minute budget. It runs overnight; give it room rather than have a slow
    # night truncate the table.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Polite, low-concurrency scan with 429 backoff — takes ~25 min.
      # If it fails we keep the scan.json already committed in the repo rather
      # than shipping an empty table. That fallback is deliberate, but it used
      # to be indistinguishable from success: continue-on-error turned every
      # failure into a green build quietly serving stale numbers, including the
      # integrity abort the scan raises on purpose. The exit code is captured
      # instead so the two cases can be told apart without re-running a 25
      # minute scan.
      - name: Refresh scan data
        id: scan
        run: |
          set +e
          npm run scan
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # Exit 3 is scan.mjs refusing to publish data it knows is wrong. That is a
      # bug to fix, not weather to wait out, so it must not deploy.
      - name: Refuse to deploy on an integrity abort
        if: steps.scan.outputs.code == '3'
        run: |
          echo "::error::Scan aborted on an integrity check. Refusing to publish."
          exit 1

      # Any other non-zero is a network/rate-limit failure: fall back to the
      # committed scan.json, but say so loudly and name its age.
      - name: Warn that this deploy is serving stale data
        if: steps.scan.outputs.code != '0' && steps.scan.outputs.code != '3'
        run: |
          gen=$(node -p "JSON.parse(require('fs').readFileSync('public/scan.json','utf8')).generatedAt")
          echo "::warning::Scan failed (exit ${{ steps.scan.outputs.code }}). Deploying committed scan.json from $gen."

      - run: npm run build

      - name: Publish dist to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
